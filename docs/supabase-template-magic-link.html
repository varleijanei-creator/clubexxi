<!--
  Template "Magic Link" do Supabase Auth.
  Colar em: Supabase > Authentication > Emails > Magic Link (corpo da mensagem).
  Assunto sugerido: Seu link de acesso ao Clube 21

  IMPORTANTE — o link usa {{ .RedirectTo }}, NÃO {{ .SiteURL }}.
  O FormLogin já manda emailRedirectTo = <origem>/auth/confirm?next=<destino>,
  então {{ .RedirectTo }} chega com "?next=..." embutido e só falta anexar
  token_hash e type com "&". Assim o "next" sobrevive e o link funciona em
  produção e em preview, sem depender do Site URL.

  Pré-requisito: a origem (com /auth/confirm) precisa estar em
  Authentication > URL Configuration > Redirect URLs, senão o Supabase
  ignora o RedirectTo e cai no Site URL.

  Estilo inline e layout em tabela, porque cliente de e-mail ignora CSS externo.
-->
<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Seu link de acesso ao Clube 21</title>
  </head>
  <body style="margin:0;padding:0;background-color:#f6f1e9;">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background-color:#f6f1e9;">
      <tr>
        <td align="center" style="padding:32px 16px;">
          <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:480px;background-color:#ffffff;border-radius:12px;">
            <tr>
              <td style="padding:32px 32px 8px 32px;font-family:Georgia,'Times New Roman',serif;font-size:22px;font-weight:bold;color:#2b2320;">
                Clube 21
              </td>
            </tr>
            <tr>
              <td style="padding:8px 32px 0 32px;font-family:Arial,Helvetica,sans-serif;font-size:15px;line-height:1.6;color:#2b2320;">
                Você pediu um link para entrar. É só clicar no botão abaixo.
              </td>
            </tr>
            <tr>
              <td align="center" style="padding:28px 32px;">
                <a
                  href="{{ .RedirectTo }}&token_hash={{ .TokenHash }}&type=email"
                  style="display:inline-block;padding:14px 28px;background-color:#2b2320;color:#ffffff;font-family:Arial,Helvetica,sans-serif;font-size:15px;font-weight:bold;text-decoration:none;border-radius:999px;"
                >
                  Entrar
                </a>
              </td>
            </tr>
            <tr>
              <td style="padding:0 32px 32px 32px;font-family:Arial,Helvetica,sans-serif;font-size:13px;line-height:1.6;color:#6b5f57;">
                O link é de uso único e expira em pouco tempo. Se você não pediu
                este acesso, pode ignorar este e-mail.
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
